name: Centelha Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['centelha-das-ideias/**', '.github/workflows/centelha-android.yml']
  pull_request:
    paths: ['centelha-das-ideias/**', '.github/workflows/centelha-android.yml']

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: centelha-das-ideias
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '10.17.1'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK fixado
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Instalar dependências do jogo
        run: pnpm install --frozen-lockfile
      - name: Testar jogo
        run: pnpm testar
      - name: Compilar jogo e APK debug; validar Android Lint
        run: pnpm android:apk
      - name: Publicar APK instalável e relatório
        uses: actions/upload-artifact@v4
        with:
          name: centelha-android-debug
          path: |
            centelha-das-ideias/android/app/build/outputs/apk/debug/app-debug.apk
            centelha-das-ideias/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
