plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.centelha.ideias'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'br.com.centelha.ideias'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/assets')
}

// dist é gerado por android-apk.mjs; nunca é versionado ou carregado da internet.
def prepararAssetsJogo = tasks.register('prepararAssetsJogo', Exec) {
    inputs.dir('../../dist')
    inputs.file('../../ferramentas/android-preparar.mjs')
    outputs.dir(layout.buildDirectory.dir('generated/assets/web'))
    workingDir '../..'
    commandLine 'node', 'ferramentas/android-preparar.mjs', '--somente-copiar'
}

tasks.named('preBuild').configure {
    dependsOn prepararAssetsJogo
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
